<title>ボール台帳</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Old+Mincho:wght@600;700&family=Zen+Kaku+Gothic+New:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
:root{
  --paper:#F7F5F1; --surface:#FFFFFF; --surface-2:#F1EEE8; --sunk:#EAE6DE;
  --line:#DFD9CF; --line-strong:#C6BFB2;
  --ink:#1D1B17; --ink-2:#5B5750; --ink-3:#8B857B;
  --accent:#1D4E6E; --accent-ink:#FFFFFF; --accent-soft:#E3EDF3; --accent-line:#B9D2E1;
  --ok:#2E6B4F; --ok-soft:#E2EFE7;
  --warn:#9A6417; --warn-soft:#F6EBD8;
  --crit:#A33327; --crit-soft:#F7E4E0;
  --shadow:0 1px 0 rgba(29,27,23,.04), 0 2px 10px rgba(29,27,23,.05);
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --sans:"Zen Kaku Gothic New",-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Noto Sans JP",sans-serif;
  --serif:"Zen Old Mincho","Hiragino Mincho ProN","Yu Mincho",serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#171614; --surface:#1F1E1B; --surface-2:#26241F; --sunk:#141311;
    --line:#35322C; --line-strong:#4A463E;
    --ink:#EFEBE3; --ink-2:#A9A296; --ink-3:#7C7568;
    --accent:#7CB4D6; --accent-ink:#12212B; --accent-soft:#1E3340; --accent-line:#2F4E60;
    --ok:#6FBE92; --ok-soft:#1C3227;
    --warn:#DBA04A; --warn-soft:#382C18;
    --crit:#E3766A; --crit-soft:#3B211D;
    --shadow:0 1px 0 rgba(0,0,0,.3), 0 2px 10px rgba(0,0,0,.25);
  }
}
:root[data-theme="dark"]{
  --paper:#171614; --surface:#1F1E1B; --surface-2:#26241F; --sunk:#141311;
  --line:#35322C; --line-strong:#4A463E;
  --ink:#EFEBE3; --ink-2:#A9A296; --ink-3:#7C7568;
  --accent:#7CB4D6; --accent-ink:#12212B; --accent-soft:#1E3340; --accent-line:#2F4E60;
  --ok:#6FBE92; --ok-soft:#1C3227;
  --warn:#DBA04A; --warn-soft:#382C18;
  --crit:#E3766A; --crit-soft:#3B211D;
  --shadow:0 1px 0 rgba(0,0,0,.3), 0 2px 10px rgba(0,0,0,.25);
}

*{box-sizing:border-box}
body{
  margin:0; background:var(--paper); color:var(--ink);
  font-family:var(--sans); font-size:15px; line-height:1.7;
  -webkit-text-size-adjust:100%;
}
.wrap{max-width:780px; margin:0 auto; padding:0 16px 96px}

/* ---------- masthead ---------- */
.masthead{padding:26px 0 16px; border-bottom:1px solid var(--line)}
.masthead h1{
  font-family:var(--serif); font-weight:700; font-size:26px; line-height:1.25;
  margin:0; letter-spacing:.04em; text-wrap:balance;
}
.masthead p{margin:6px 0 0; color:var(--ink-2); font-size:13px; line-height:1.6}

/* ---------- sticky control bar ---------- */
.bar{
  position:sticky; top:0; z-index:20; background:var(--paper);
  border-bottom:1px solid var(--line); margin:0 -16px; padding:10px 16px 0;
}
.bar-row{display:flex; align-items:center; gap:10px; flex-wrap:wrap}
.who{
  display:inline-flex; align-items:center; gap:8px; background:var(--surface);
  border:1px solid var(--line-strong); border-radius:2px; padding:5px 10px;
  font-size:13px; cursor:pointer; color:var(--ink); font-family:var(--sans);
}
.who:hover{border-color:var(--accent)}
.who .dot{width:8px;height:8px;border-radius:50%;background:var(--accent);flex:none}
.who .nm{font-weight:700}
.who .lbl{color:var(--ink-3); font-size:11px; letter-spacing:.08em}
.spacer{flex:1 1 auto}

.filters{display:flex; gap:4px; overflow-x:auto; padding:10px 0 9px; scrollbar-width:none}
.filters::-webkit-scrollbar{display:none}
.fbtn{
  flex:none; border:1px solid transparent; background:none; color:var(--ink-2);
  font-family:var(--sans); font-size:13px; padding:4px 10px; border-radius:2px;
  cursor:pointer; white-space:nowrap; display:inline-flex; align-items:baseline; gap:6px;
}
.fbtn:hover{background:var(--surface-2); color:var(--ink)}
.fbtn[aria-pressed="true"]{background:var(--ink); color:var(--paper); font-weight:500}
.fbtn .n{font-family:var(--mono); font-size:11px; font-variant-numeric:tabular-nums; opacity:.75}

/* ---------- holder tally ---------- */
.tally{display:flex; gap:8px; overflow-x:auto; padding:16px 0 4px; margin:0 -16px; padding-left:16px; padding-right:16px; scrollbar-width:none}
.tally::-webkit-scrollbar{display:none}
.tallyhead{
  font-size:11px; letter-spacing:.14em; color:var(--ink-3); text-transform:uppercase;
  padding:18px 0 0; font-family:var(--mono); font-weight:500;
}
.tcard{
  flex:none; min-width:104px; background:var(--surface); border:1px solid var(--line);
  border-radius:2px; padding:9px 11px 10px; cursor:pointer; text-align:left;
  font-family:var(--sans); font-size:13px; line-height:1.5; color:var(--ink); box-shadow:var(--shadow);
}
.tcard:hover{border-color:var(--line-strong)}
.tcard[aria-pressed="true"]{border-color:var(--accent); background:var(--accent-soft)}
.tcard .tn{font-size:13px; font-weight:700; display:flex; align-items:center; gap:6px}
.tcard .tn i{width:7px;height:7px;border-radius:50%;background:var(--accent);flex:none;display:block}
.tcard .tc{display:block; font-family:var(--mono); font-size:22px; font-weight:500; line-height:1.2; font-variant-numeric:tabular-nums; margin-top:2px}
.tcard .tw{display:block; font-size:11px; color:var(--crit); font-weight:500; line-height:1.4}
.tcard .tw.calm{color:var(--ink-3); font-weight:400}

/* ---------- your own balls, pinned ---------- */
.mine{
  background:var(--accent-soft); border:1px solid var(--accent-line); border-radius:2px;
  padding:12px 13px 13px; margin-top:18px;
}
.mine-head{display:flex; align-items:baseline; gap:9px; flex-wrap:wrap; margin-bottom:9px}
.mine-head .h{font-family:var(--serif); font-size:15px; font-weight:600; letter-spacing:.03em}
.mine-head .n{font-family:var(--mono); font-size:21px; font-weight:600; color:var(--accent); font-variant-numeric:tabular-nums; line-height:1}
.mine.q{background:var(--warn-soft); border-color:var(--warn)}
.mine.q .mine-head .n{color:var(--warn)}
.mine.a{background:var(--ok-soft); border-color:var(--ok)}
.mine.a .mine-head .n{color:var(--ok)}
.pending-note{
  margin:8px 0 0; font-size:12.5px; color:var(--ink-2); background:none; border:0; padding:4px 2px;
  font-family:var(--sans); text-align:left; cursor:pointer; text-decoration:underline; text-underline-offset:3px;
}
.qquote{
  background:var(--warn-soft); border:1px solid var(--line); border-radius:2px;
  padding:10px 12px; font-size:13.5px; line-height:1.65; margin:0 0 13px; white-space:pre-wrap;
}
.mine-head .s{font-size:11.5px; color:var(--ink-2); font-family:var(--mono); margin-left:auto}
.minelist{list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:3px}
.minerow{
  display:grid; grid-template-columns:auto 1fr; gap:11px; align-items:baseline; width:100%;
  text-align:left; background:var(--surface); border:1px solid transparent; border-radius:2px;
  padding:8px 10px; cursor:pointer; font-family:var(--sans); font-size:13px; line-height:1.6; color:var(--ink);
}
.minerow:hover{border-color:var(--accent)}
.minerow .d{font-family:var(--mono); font-size:16px; font-weight:600; font-variant-numeric:tabular-nums; min-width:3.2em; text-align:right; white-space:nowrap}
.minerow .d.calm{color:var(--ink-3)}
.minerow .d.warn{color:var(--warn)}
.minerow .d.crit{color:var(--crit)}
.minerow .d small{font-size:11px; font-weight:400; color:var(--ink-3); margin-left:1px}
.minerow .d.by{font-size:12px; font-weight:700; min-width:4.5em; color:var(--ok)}
.minerow .t{font-weight:700}
.minerow .a{display:block; color:var(--ink-2); font-size:12.5px}

/* ---------- one person in focus ---------- */
.focus{
  display:flex; align-items:center; gap:10px; flex-wrap:wrap; margin-top:16px;
  padding:11px 13px; background:var(--surface); border:1px solid var(--line-strong); border-radius:2px;
}
.focus .fn{font-family:var(--serif); font-size:17px; font-weight:600; display:flex; align-items:center; gap:8px; letter-spacing:.02em}
.focus .fn i{width:9px; height:9px; border-radius:50%; background:var(--accent); display:block; flex:none}
.focus .fs{font-family:var(--mono); font-size:11.5px; color:var(--ink-2); font-variant-numeric:tabular-nums}
.focus .sp{flex:1 1 auto}

/* ---------- case cards ---------- */
.list{display:flex; flex-direction:column; gap:10px; margin-top:14px}
.case{
  background:var(--surface); border:1px solid var(--line); border-radius:2px;
  box-shadow:var(--shadow); overflow:hidden;
}
.case.is-done{opacity:.62}
.case.is-mine{border-color:var(--accent-line)}
.case-head{
  display:grid; grid-template-columns:1fr auto; gap:12px; align-items:start;
  width:100%; text-align:left; background:none; border:0; padding:14px 15px 13px;
  cursor:pointer; font-family:var(--sans); color:var(--ink);
  font-size:15px; line-height:1.7;
}
.case-head:hover{background:var(--surface-2)}
.kind{
  display:inline-block; font-size:11px; letter-spacing:.06em; padding:1px 7px;
  border:1px solid var(--line-strong); border-radius:2px; color:var(--ink-2);
  vertical-align:2px; margin-right:8px;
}
.title{font-family:var(--serif); font-weight:600; font-size:19px; line-height:1.4; letter-spacing:.02em}
.stall{text-align:right; flex:none}
.stall .v{font-family:var(--mono); font-size:25px; font-weight:500; line-height:1; font-variant-numeric:tabular-nums}
.stall .u{font-size:11px; color:var(--ink-3); letter-spacing:.06em; display:block; margin-top:3px}
.stall .u.only{margin-top:0; padding-top:9px; white-space:nowrap}
.stall.calm .v{color:var(--ink-3)}
.stall.warn .v{color:var(--warn)}
.stall.crit .v{color:var(--crit)}

.phase{display:flex; align-items:center; gap:9px; margin-top:9px}
.phase .no{font-family:var(--mono); font-size:11px; color:var(--ink-3); font-variant-numeric:tabular-nums; letter-spacing:.02em}
.phase .nm{font-size:12px; color:var(--ink-2); white-space:nowrap}
.ticks{display:flex; gap:2px; flex:1 1 auto; min-width:60px}
.ticks i{display:block; height:3px; flex:1; background:var(--sunk); border-radius:1px}
.ticks i.on{background:var(--accent)}

.ball{display:flex; align-items:baseline; gap:8px; margin-top:11px; flex-wrap:wrap}
.ball .b{
  display:inline-flex; align-items:center; gap:7px; background:var(--accent);
  color:var(--accent-ink); border-radius:2px; padding:3px 10px 4px;
  font-weight:700; font-size:14px;
}
.ball .b i{width:8px;height:8px;border-radius:50%;background:currentColor;flex:none;display:block;opacity:.85}
.ball .sfx{font-size:12px; color:var(--ink-2)}
.ball.none .b{background:var(--sunk); color:var(--ink-2)}
.ball.you .b{box-shadow:0 0 0 3px var(--accent-soft)}
.ask{display:block; margin:8px 0 0; font-size:14px; color:var(--ink); line-height:1.65}
.ask:before{content:"「"; color:var(--ink-3)}
.ask:after{content:"」"; color:var(--ink-3)}
.ask.blank{color:var(--ink-3); font-size:13px}
.ask.blank:before,.ask.blank:after{content:none}

.meta{
  display:flex; gap:14px; flex-wrap:wrap; margin-top:10px; padding-top:9px;
  border-top:1px dashed var(--line); font-family:var(--mono); font-size:11px;
  color:var(--ink-3); font-variant-numeric:tabular-nums; letter-spacing:.01em;
}
.meta b{font-weight:500; color:var(--ink-2)}
.meta .due-over{color:var(--crit); font-weight:600}
.meta .due-soon{color:var(--warn); font-weight:600}

/* ---------- an unanswered question, held open on the card ---------- */
.qband{
  border-top:1px solid var(--line); background:var(--warn-soft);
  padding:11px 15px 12px; display:flex; flex-direction:column; gap:9px;
}
.qrow{display:flex; gap:10px; align-items:flex-start; flex-wrap:wrap}
.qwho{
  font-family:var(--mono); font-size:11px; font-weight:600; color:var(--warn);
  letter-spacing:.02em; flex:none; padding-top:3px; white-space:nowrap;
}
.qtext{font-size:13.5px; line-height:1.65; flex:1 1 180px; min-width:0; white-space:pre-wrap}
.qband .btn{align-self:flex-start}

/* ---------- expanded panel ---------- */
.panel{border-top:1px solid var(--line); background:var(--surface-2); padding:14px 15px 16px}
.acts{display:flex; gap:7px; flex-wrap:wrap}
.btn{
  font-family:var(--sans); font-size:13px; font-weight:500; padding:7px 13px;
  border-radius:2px; border:1px solid var(--line-strong); background:var(--surface);
  color:var(--ink); cursor:pointer;
}
.btn:hover{border-color:var(--accent); color:var(--accent)}
.btn.primary{background:var(--accent); border-color:var(--accent); color:var(--accent-ink)}
.btn.primary:hover{opacity:.88; color:var(--accent-ink)}
.btn.quiet{border-color:transparent; color:var(--ink-3)}
.btn.quiet:hover{color:var(--crit); border-color:var(--crit)}
.btn:disabled{opacity:.45; cursor:not-allowed}

.form{margin-top:12px; display:flex; flex-direction:column; gap:9px}
.field{display:flex; flex-direction:column; gap:4px}
.field > span{font-size:11px; letter-spacing:.1em; color:var(--ink-3); font-family:var(--mono); font-weight:500}
input[type=text],input[type=date],select,textarea{
  font-family:var(--sans); font-size:15px; color:var(--ink); background:var(--surface);
  border:1px solid var(--line-strong); border-radius:2px; padding:8px 10px; width:100%;
}
input[type=date]{font-family:var(--mono); font-size:14px}
textarea{resize:vertical; min-height:66px; line-height:1.6}
input:focus-visible,select:focus-visible,textarea:focus-visible,button:focus-visible{
  outline:2px solid var(--accent); outline-offset:2px;
}
.row2{display:grid; grid-template-columns:1fr 1fr; gap:9px}
@media (max-width:520px){ .row2{grid-template-columns:1fr} }
.chips{display:flex; gap:6px; flex-wrap:wrap}
.chip{
  font-family:var(--sans); font-size:13px; padding:5px 11px; border-radius:2px;
  border:1px solid var(--line-strong); background:var(--surface); color:var(--ink); cursor:pointer;
}
.chip{text-align:left; line-height:1.5}
.chip .r{display:block; font-size:10.5px; font-weight:400; opacity:.72; line-height:1.4; margin-top:1px}
.chip[aria-pressed="true"]{background:var(--accent); border-color:var(--accent); color:var(--accent-ink); font-weight:700}
.chip.add{border-style:dashed; color:var(--ink-3)}

/* ---------- log ---------- */
.loghead{
  font-family:var(--mono); font-size:11px; letter-spacing:.14em; color:var(--ink-3);
  margin:18px 0 8px; font-weight:500;
}
.log{list-style:none; margin:0; padding:0; border-left:1px solid var(--line); }
.log li{position:relative; padding:0 0 13px 16px}
.log li:last-child{padding-bottom:0}
.log li:before{
  content:""; position:absolute; left:-3.5px; top:8px; width:6px; height:6px;
  border-radius:50%; background:var(--line-strong);
}
.log li.k-pass:before{background:var(--accent)}
.log li.k-nudge:before,.log li.k-ask:before{background:var(--warn)}
.log li.k-reply:before,.log li.k-done:before{background:var(--ok)}
.log .lh{display:flex; gap:9px; align-items:baseline; flex-wrap:wrap; font-size:13px}
.log .lw{font-weight:700}
.log .lk{
  font-size:11px; padding:0 6px; border-radius:2px; background:var(--sunk); color:var(--ink-2);
}
.log li.k-pass .lk{background:var(--accent-soft); color:var(--accent)}
.log li.k-nudge .lk{background:var(--crit-soft); color:var(--crit)}
.log li.k-ask .lk{background:var(--warn-soft); color:var(--warn)}
.log li.k-reply .lk,.log li.k-done .lk{background:var(--ok-soft); color:var(--ok)}
.log .lt{font-family:var(--mono); font-size:11px; color:var(--ink-3); font-variant-numeric:tabular-nums; margin-left:auto}
.log .lb{display:block; font-size:13px; color:var(--ink-2); line-height:1.65; margin-top:1px; white-space:pre-wrap}

/* ---------- notices / empty ---------- */
.notice{
  border:1px solid var(--line); background:var(--surface); border-radius:2px;
  padding:16px 17px; margin-top:18px; box-shadow:var(--shadow);
}
.notice h3{margin:0 0 6px; font-size:15px; font-family:var(--serif); font-weight:600; letter-spacing:.02em}
.notice p{margin:0; color:var(--ink-2); font-size:13.5px; line-height:1.75}
.notice.warn{border-color:var(--warn); background:var(--warn-soft)}
.notice.warn h3,.notice.warn p{color:var(--ink)}
.empty{text-align:center; padding:44px 20px 40px; color:var(--ink-3)}
.empty h3{font-family:var(--serif); font-size:18px; color:var(--ink-2); margin:0 0 8px; font-weight:600}
.empty p{margin:0 auto 18px; max-width:34em; font-size:13.5px; line-height:1.8}

/* ---------- new case fab ---------- */
.newbar{
  position:fixed; left:0; right:0; bottom:0; z-index:30; padding:10px 16px 14px;
  background:linear-gradient(to top, var(--paper) 68%, transparent);
  display:flex; justify-content:center; pointer-events:none;
}
.newbar .btn{pointer-events:auto; box-shadow:var(--shadow); padding:10px 22px; font-size:14px; font-weight:700}

/* ---------- dialog ---------- */
.scrim{
  position:fixed; inset:0; z-index:40; background:rgba(20,19,17,.45);
  display:flex; align-items:flex-end; justify-content:center; padding:0;
}
@media (min-width:560px){ .scrim{align-items:center; padding:24px} }
.sheet{
  background:var(--surface); border:1px solid var(--line-strong); border-radius:2px;
  width:100%; max-width:520px; max-height:88vh; overflow:auto; padding:18px 18px 20px;
}
.sheet h2{margin:0 0 3px; font-family:var(--serif); font-size:19px; font-weight:600; letter-spacing:.02em}
.sheet .sub{margin:0 0 14px; font-size:12.5px; color:var(--ink-3); line-height:1.6}
.sheet textarea.share{min-height:190px; font-size:13.5px; font-family:var(--sans); line-height:1.7}
.roster{display:flex; flex-direction:column; gap:8px}
.rrow{display:grid; grid-template-columns:7.5em 1fr; gap:9px; align-items:center}
.rrow .rn{font-weight:700; font-size:14px}
.sheet .foot{display:flex; gap:8px; justify-content:flex-end; margin-top:16px}
.err{color:var(--crit); font-size:12.5px; margin:8px 0 0; min-height:1px}
[hidden]{display:none!important}
@media (min-width:900px){
  .wrap{max-width:1060px}
  .list{display:grid; grid-template-columns:1fr 1fr; align-items:start; gap:12px}
  .case.is-open{grid-column:1 / -1}
  .minelist{display:grid; grid-template-columns:1fr 1fr; gap:4px}
  .btn,.chip{padding-top:9px; padding-bottom:9px}
  .masthead h1{font-size:30px}
}
@media (prefers-reduced-motion:reduce){ *{transition:none!important; animation:none!important} }
</style>

<div class="wrap">
  <header class="masthead">
    <h1>ボール台帳</h1>
    <p>いま誰がボールを持っていて、何日止まっているか。全員が書き込み、全員が同じものを見る。</p>
  </header>

  <div class="bar">
    <div class="bar-row">
      <button class="who" id="whoBtn" type="button">
        <span class="dot"></span>
        <span class="lbl">あなた</span>
        <span class="nm" id="whoName">未設定</span>
      </button>
      <button class="who" id="rosterBtn" type="button"><span class="lbl">名簿</span></button>
      <span class="spacer"></span>
      <span id="conn" style="font-family:var(--mono);font-size:11px;color:var(--ink-3)"></span>
    </div>
    <div class="filters" id="filters"></div>
  </div>

  <div id="body"></div>
</div>

<div class="newbar"><button class="btn primary" id="newBtn" type="button">＋ 案件を追加</button></div>
<div id="modal"></div>

<script>
(function(){
"use strict";

/* ===== 工程（建売・注文住宅の実際の順序） ===== */
var PHASES = ["用地・仕入","企画・設計","確認申請","契約","着工","上棟","内装・設備","完了検査","引渡・決済"];
var KINDS  = ["建売","注文","土地","リフォーム","その他"];

/* 初期の名簿。名簿画面でいつでも足せる・直せる */
var TEAM = [
  { name:"専務",   role:"決裁・全体判断" },
  { name:"酒井",   role:"" },
  { name:"拓也",   role:"設計" },
  { name:"山口",   role:"工事" },
  { name:"渡邉",   role:"土地決済・契約手続き・物件売却" }
];

var DAY = 86400000;
var LOG_KIND = {
  create:"登録", pass:"引き渡し", note:"進捗", nudge:"催促",
  phase:"工程", done:"完了", reopen:"再開", edit:"修正",
  ask:"質問", reply:"返答"
};

var db = null, dbState = "loading";
var state = {
  me: null, members: [], roles: {}, cases: [], logs: [], openId: null, shareUrl: "", jumpTo: null,
  filter: "all", holderFilter: null, logUnsub: null, err: ""
};

/* ===== utilities ===== */
function esc(s){
  return String(s == null ? "" : s).replace(/[&<>"']/g, function(c){
    return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];
  });
}
function nid(p){
  return p + Date.now().toString(36) + "-" + Math.random().toString(36).slice(2, 8);
}
function todayStr(){
  var d = new Date();
  return d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0") + "-" + String(d.getDate()).padStart(2,"0");
}
function startOfToday(){ var d = new Date(); d.setHours(0,0,0,0); return d.getTime(); }
function daysSince(ms){
  if(!ms) return 0;
  var d = new Date(ms); d.setHours(0,0,0,0);
  return Math.max(0, Math.round((startOfToday() - d.getTime()) / DAY));
}
function daysUntil(dateStr){
  if(!dateStr) return null;
  var p = dateStr.split("-");
  if(p.length !== 3) return null;
  var d = new Date(+p[0], +p[1]-1, +p[2]); d.setHours(0,0,0,0);
  return Math.round((d.getTime() - startOfToday()) / DAY);
}
function fmtDate(ms){
  if(!ms) return "—";
  var d = new Date(ms);
  return (d.getMonth()+1) + "/" + d.getDate();
}
function fmtStamp(ms){
  var d = new Date(ms);
  return (d.getMonth()+1) + "/" + d.getDate() + " " +
    String(d.getHours()).padStart(2,"0") + ":" + String(d.getMinutes()).padStart(2,"0");
}
function stallLevel(c){
  if(c.status === "done") return "calm";
  var d = daysSince(c.movedAt);
  var u = daysUntil(c.due);
  if(d >= 7 || (u !== null && u < 0)) return "crit";
  if(d >= 3 || (u !== null && u <= 1)) return "warn";
  return "calm";
}
function needsAttention(c){
  return c.status !== "done" && (stallLevel(c) !== "calm" || pendingOf(c).length > 0);
}
function pendingOf(c){ return Array.isArray(c.pending) ? c.pending : []; }
function rank(c){
  if(pendingOf(c).length) return 0;
  return { crit:1, warn:2, calm:3 }[stallLevel(c)];
}
function seenReply(caseId){
  try{ return +(localStorage.getItem("ballboard.seen." + caseId) || 0); }catch(e){ return 0; }
}
function markReplySeen(caseId, at){
  try{ localStorage.setItem("ballboard.seen." + caseId, String(at)); }catch(e){}
}
/* 自分が出した質問への返答で、まだ読んでいないもの */
function repliesToMe(){
  if(!state.me) return [];
  return state.cases.filter(function(c){
    var r = c.lastReply;
    return r && r.to === state.me && r.at > seenReply(c.id);
  }).sort(function(a,b){ return b.lastReply.at - a.lastReply.at; });
}
/* 自分あての未回答の質問 */
function questionsToMe(){
  if(!state.me) return [];
  var out = [];
  state.cases.forEach(function(c){
    if(c.status === "done") return;
    pendingOf(c).forEach(function(q){ if(q.to === state.me) out.push({ c: c, q: q }); });
  });
  return out.sort(function(a,b){ return a.q.at - b.q.at; });
}
/* 自分が出したまま返ってきていない質問 */
function questionsFromMe(){
  if(!state.me) return [];
  var out = [];
  state.cases.forEach(function(c){
    if(c.status === "done") return;
    pendingOf(c).forEach(function(q){ if(q.by === state.me) out.push({ c: c, q: q }); });
  });
  return out;
}

/* ===== db plumbing ===== */
function setConn(txt){ document.getElementById("conn").textContent = txt; }

function fail(e){
  var code = e && e.code ? e.code : "unavailable";
  if(code === "quota_exceeded") state.err = "保存できる件数が上限に達しました。古い案件を削除してください。";
  else if(code === "resource_exhausted") state.err = "書き込みが混み合っています。少し待ってからもう一度。";
  else if(code === "revoked" || code === "not_granted") state.err = "共有データへの権限がなくなりました。ページを開き直してください。";
  else state.err = "保存できませんでした。通信を確認してもう一度お試しください。";
  render();
}

function boot(){
  render();
  if(!window.claude || !window.claude.use){ dbState = "off"; render(); return; }
  window.claude.use("db").then(function(x){
    if(!x){ dbState = "off"; render(); return; }
    db = x; dbState = "on";
    setConn("同期中");
    db.doc("meta/members").onSnapshot(function(snap){
      var d = snap.exists ? snap.data() : null;
      state.members = (d && Array.isArray(d.list)) ? d.list.slice() : [];
      state.roles = (d && d.roles && typeof d.roles === "object") ? d.roles : {};
      render();
    }, function(){ /* members are optional; the board still works */ });
    db.doc("meta/config").onSnapshot(function(snap){
      var d = snap.exists ? snap.data() : null;
      state.shareUrl = (d && typeof d.shareUrl === "string") ? d.shareUrl : "";
      render();
    }, function(){ /* the link is optional */ });
    db.collection("cases").onSnapshot(function(snap){
      state.cases = snap.docs.map(function(s){
        var v = s.data() || {}; v.id = s.id; return v;
      });
      setConn(snap.metadata.fromCache ? "同期中" : "同期済");
      render();
    }, function(e){ dbState = "error"; fail(e); });
  }, function(){ dbState = "off"; render(); });
}

function watchLog(caseId){
  if(state.logUnsub){ state.logUnsub(); state.logUnsub = null; }
  state.logs = [];
  if(!db || !caseId) return;
  state.logUnsub = db.collection("cases/" + caseId + "/log")
    .orderBy("at","desc").limit(40)
    .onSnapshot(function(snap){
      state.logs = snap.docs.map(function(s){ var v = s.data() || {}; v.id = s.id; return v; });
      render();
    }, function(){ /* log is supplementary; the card still renders */ });
}

function writeLog(caseId, kind, text, to){
  if(!db) return Promise.resolve();
  return db.collection("cases/" + caseId + "/log").doc(nid("l_")).set({
    at: Date.now(), by: state.me || "不明", kind: kind,
    text: text || "", to: to || ""
  });
}

function roster(){
  var seen = {}, out = [];
  TEAM.concat(state.members.map(function(n){ return { name:n, role:"" }; })).forEach(function(m){
    if(!m.name || seen[m.name]) return;
    seen[m.name] = 1;
    out.push({ name: m.name, role: roleOf(m.name) });
  });
  if(state.me && !seen[state.me]) out.unshift({ name: state.me, role: roleOf(state.me) });
  return out;
}
function roleOf(name){
  if(state.roles && typeof state.roles[name] === "string") return state.roles[name];
  for(var i = 0; i < TEAM.length; i++) if(TEAM[i].name === name) return TEAM[i].role;
  return "";
}
function saveRoster(list, roles){
  if(!db) return Promise.resolve();
  return db.doc("meta/members").set({ list: list, roles: roles });
}

function rememberMember(name){
  if(!db || !name) return;
  db.doc("meta/members").get().then(function(snap){
    var d = snap.exists ? (snap.data() || {}) : {};
    var list = Array.isArray(d.list) ? d.list.slice() : [];
    if(list.indexOf(name) === -1){
      list.push(name);
      db.doc("meta/members").set({ list: list, roles: d.roles || {} });
    }
  }).catch(function(){});
}

/* ===== actions ===== */
function createCase(v){
  var id = nid("c_"), now = Date.now();
  return db.collection("cases").doc(id).set({
    title: v.title, kind: v.kind, phase: v.phase, holder: v.holder,
    ask: v.ask, due: v.due, status: "open",
    movedAt: now, updatedAt: now, createdAt: now, createdBy: state.me
  }).then(function(){
    return writeLog(id, "create", v.holder ? (v.holder + " から開始") : "担当未定で登録", v.holder);
  }).then(function(){ state.openId = id; watchLog(id); });
}

function passBall(c, to, ask, note){
  var now = Date.now();
  return db.collection("cases").doc(c.id).update({
    holder: to, ask: ask, movedAt: now, updatedAt: now
  }).then(function(){
    var body = (note ? note + "\n" : "") + "依頼：" + ask;
    return writeLog(c.id, "pass", body, to);
  });
}
function addNote(c, note){
  var now = Date.now();
  return db.collection("cases").doc(c.id).update({ movedAt: now, updatedAt: now })
    .then(function(){ return writeLog(c.id, "note", note); });
}
function nudge(c, note){
  return db.collection("cases").doc(c.id).update({ updatedAt: Date.now() })
    .then(function(){ return writeLog(c.id, "nudge", note || (c.holder + " さんへ確認をお願いします"), c.holder); });
}
function fresh(c){ return state.cases.filter(function(x){ return x.id === c.id; })[0] || c; }

function askQuestion(c, to, text){
  var q = { id: nid("q_"), at: Date.now(), by: state.me, to: to, text: text };
  var list = pendingOf(fresh(c)).slice().concat([q]).slice(-6);
  return db.collection("cases").doc(c.id).update({ pending: list, updatedAt: Date.now() })
    .then(function(){ return writeLog(c.id, "ask", text, to); });
}
/* 返答しても停滞日数は戻さない。質問に答えることと、ボールが動くことは別 */
function answerQuestion(c, q, text){
  var list = pendingOf(fresh(c)).filter(function(x){ return x.id !== q.id; });
  var now = Date.now();
  return db.collection("cases").doc(c.id).update({
    pending: list, updatedAt: now,
    lastReply: { at: now, by: state.me, to: q.by, text: text, q: q.text }
  }).then(function(){
    return writeLog(c.id, "reply", "Q（" + q.by + "）" + q.text + "\n→ " + text, q.by);
  });
}

function setPhase(c, phase){
  var now = Date.now();
  return db.collection("cases").doc(c.id).update({ phase: phase, movedAt: now, updatedAt: now })
    .then(function(){ return writeLog(c.id, "phase", PHASES[phase] + " に進めた"); });
}
function finish(c){
  return db.collection("cases").doc(c.id).update({ status: "done", updatedAt: Date.now() })
    .then(function(){ return writeLog(c.id, "done", "完了"); });
}
function reopen(c){
  var now = Date.now();
  return db.collection("cases").doc(c.id).update({ status: "open", movedAt: now, updatedAt: now })
    .then(function(){ return writeLog(c.id, "reopen", "再開"); });
}
function editCase(c, v){
  return db.collection("cases").doc(c.id).update({
    title: v.title, kind: v.kind, due: v.due, ask: v.ask, updatedAt: Date.now()
  }).then(function(){ return writeLog(c.id, "edit", "案件の内容を修正"); });
}

function holderCases(name){
  return state.cases.filter(function(c){
    return c.status !== "done" && (c.holder || "") === name;
  }).sort(function(a,b){
    return (rank(a) - rank(b)) || ((a.movedAt || 0) - (b.movedAt || 0));
  });
}

function buildShareText(name, list){
  var now = new Date();
  var stamp = (now.getMonth()+1) + "/" + now.getDate() + "時点";
  var head = list.length
    ? "【" + (name || "担当未定") + "のボール " + list.length + "件】" + stamp
    : "【" + (name || "担当未定") + "への確認】" + stamp;
  var lines = list.map(function(c, i){
    var tags = [ PHASES[typeof c.phase === "number" ? c.phase : 0] ];
    var st = daysSince(c.movedAt);
    if(st > 0) tags.push(st + "日止まっています");
    var u = daysUntil(c.due);
    if(u !== null) tags.push(u < 0 ? "期限" + (-u) + "日超過" : u === 0 ? "期限は今日" : "期限まであと" + u + "日");
    return (i+1) + ". " + c.title + "（" + tags.join("・") + "）\n   → " + (c.ask || "次にやることが未記入");
  });
  var qs = [];
  state.cases.forEach(function(c){
    if(c.status === "done") return;
    pendingOf(c).forEach(function(q){
      if(q.to !== name) return;
      qs.push("・" + c.title + "：" + q.text + "（" + q.by + "・" + daysSince(q.at) + "日未回答）");
    });
  });
  var qBlock = qs.length ? "\n\n【返答待ちの質問 " + qs.length + "件】\n" + qs.join("\n") : "";

  return head + (lines.length ? "\n" + lines.join("\n") : "") + qBlock +
    (state.shareUrl ? "\n\n台帳 " + state.shareUrl : "");
}

/* ===== filtering ===== */
function visibleCases(){
  var list = state.cases.slice();
  if(state.filter === "done") list = list.filter(function(c){ return c.status === "done"; });
  else list = list.filter(function(c){ return c.status !== "done"; });
  if(state.filter === "mine") list = list.filter(function(c){ return state.me && c.holder === state.me; });
  if(state.filter === "stuck") list = list.filter(needsAttention);
  if(state.filter === "q") list = list.filter(function(c){ return pendingOf(c).length > 0; });
  if(state.holderFilter !== null) list = list.filter(function(c){ return (c.holder || "") === state.holderFilter; });
  list.sort(function(a,b){
    return (rank(a) - rank(b)) || ((a.movedAt || 0) - (b.movedAt || 0));
  });
  return list;
}
function counts(){
  var open = state.cases.filter(function(c){ return c.status !== "done"; });
  return {
    all: open.length,
    mine: state.me ? open.filter(function(c){ return c.holder === state.me; }).length : 0,
    stuck: open.filter(needsAttention).length,
    q: open.filter(function(c){ return pendingOf(c).length > 0; }).length,
    done: state.cases.length - open.length
  };
}
function tally(){
  var open = state.cases.filter(function(c){ return c.status !== "done"; });
  var map = {}, order = [];
  function touch(k){
    if(!map[k]){ map[k] = { name: k, n: 0, warn: 0, q: 0 }; order.push(k); }
    return map[k];
  }
  open.forEach(function(c){
    var e = touch(c.holder || "");
    e.n++;
    if(needsAttention(c)) e.warn++;
    pendingOf(c).forEach(function(q){ touch(q.to || "").q++; });
  });
  return order.map(function(k){ return map[k]; })
    .sort(function(a,b){ return (b.warn + b.q) - (a.warn + a.q) || b.n - a.n; });
}

/* ===== render ===== */
function render(){
  document.getElementById("whoName").textContent = state.me || "未設定";
  renderFilters();
  var body = document.getElementById("body");

  if(dbState === "loading"){
    body.innerHTML = '<div class="empty"><h3>読み込んでいます</h3><p>共有データに接続しています。</p></div>';
    return;
  }
  if(dbState === "off" || dbState === "error"){
    body.innerHTML =
      '<div class="notice warn"><h3>共有データにつながっていません</h3>' +
      '<p>この画面では書き込みを保存できません。claude.ai にサインインした状態で、' +
      '公開されたページのリンクから開き直してください。</p></div>';
    return;
  }

  var html = "";
  if(state.err){
    html += '<div class="notice warn"><h3>保存できませんでした</h3><p>' + esc(state.err) + '</p></div>';
  }

  html += minePanelHtml();

  var t = tally();
  if(t.length){
    html += '<div class="tallyhead">ボールの持ち主</div><div class="tally">';
    t.forEach(function(h){
      var nm = (h.name || "担当未定") + (h.name && h.name === state.me ? "（あなた）" : "");
      var pressed = state.holderFilter === h.name ? "true" : "false";
      html += '<button class="tcard" type="button" data-holder="' + esc(h.name) + '" aria-pressed="' + pressed + '">' +
        '<span class="tn"><i></i>' + esc(nm) + '</span>' +
        '<span class="tc">' + h.n + '</span>' +
        '<span class="tw' + (h.warn || h.q ? "" : " calm") + '">' +
        ([ h.q ? "未回答 " + h.q : "", h.warn ? "要対応 " + h.warn : "" ]
          .filter(Boolean).join("・") || "遅れなし") + '</span></button>';
    });
    html += '</div>';
  }

  if(state.holderFilter !== null) html += focusHtml(state.holderFilter);

  var list = visibleCases();
  if(!list.length){
    html += '<div class="empty"><h3>' +
      (state.cases.length ? "この条件の案件はありません" : "まだ案件がありません") + '</h3><p>' +
      (state.cases.length
        ? "絞り込みを外すか、別の担当者を選んでください。"
        : "物件を1件登録すると、そこからボールの受け渡しが記録されていきます。工事中の物件でも、動きが止まっている案件でも構いません。") +
      '</p></div>';
  } else {
    html += '<div class="list">' + list.map(caseHtml).join("") + '</div>';
  }
  body.innerHTML = html;

  if(state.jumpTo){
    var target = body.querySelector('[data-open="' + state.jumpTo + '"]');
    state.jumpTo = null;
    if(target) target.scrollIntoView({ block: "center" });
  }
}

function minePanelHtml(){
  if(!state.me) return "";
  var out = "";

  /* 1. 自分が出した質問に返ってきた答え */
  var reps = repliesToMe();
  if(reps.length){
    out += '<section class="mine a"><div class="mine-head">' +
      '<span class="h">あなたの質問に返答がありました</span>' +
      '<span class="n">' + reps.length + '</span>' +
      '<span class="s">開くと消えます</span></div><ul class="minelist">' +
      reps.map(function(c){
        return '<li><button class="minerow" type="button" data-jump="' + esc(c.id) + '" data-seen="' + esc(c.id) + '">' +
          '<span class="d by">' + esc(c.lastReply.by) + '</span>' +
          '<span><span class="t">' + esc(c.title) + '</span>' +
          '<span class="a">' + esc(c.lastReply.text) + '</span></span></button></li>';
      }).join("") + '</ul></section>';
  }

  /* 2. 自分あての未回答の質問 */
  var qs = questionsToMe();
  if(qs.length){
    out += '<section class="mine q"><div class="mine-head">' +
      '<span class="h">あなたへの質問</span>' +
      '<span class="n">' + qs.length + '</span>' +
      '<span class="s">答えるまで全員に見えます</span></div><ul class="minelist">' +
      qs.map(function(x){
        var d = daysSince(x.q.at);
        return '<li><button class="minerow" type="button" data-jump="' + esc(x.c.id) + '">' +
          '<span class="d ' + (d >= 3 ? "crit" : d >= 1 ? "warn" : "calm") + '">' + d + '<small>日</small></span>' +
          '<span><span class="t">' + esc(x.c.title) + '</span>' +
          '<span class="a">' + esc(x.q.by) + '「' + esc(x.q.text) + '」</span></span></button></li>';
      }).join("") + '</ul></section>';
  }

  /* 3. 自分が出したまま返ってきていない質問 */
  var fromMe = questionsFromMe();
  if(fromMe.length){
    out += '<button class="pending-note" type="button" data-filter="q">' +
      'あなたが出した質問 ' + fromMe.length + '件が、まだ返ってきていません</button>';
  }

  var mine = holderCases(state.me);
  if(!mine.length) return out;
  var warn = mine.filter(needsAttention).length;

  return out + '<section class="mine"><div class="mine-head">' +
    '<span class="h">あなたが持っているボール</span>' +
    '<span class="n">' + mine.length + '</span>' +
    '<span class="s">' + (warn ? "要対応 " + warn + "件" : "遅れなし") + '</span>' +
    '</div><ul class="minelist">' +
    mine.map(function(c){
      var lvl = stallLevel(c);
      return '<li><button class="minerow" type="button" data-jump="' + esc(c.id) + '">' +
        '<span class="d ' + lvl + '">' + daysSince(c.movedAt) + '<small>日</small></span>' +
        '<span><span class="t">' + esc(c.title) + '</span>' +
        '<span class="a">' + esc(c.ask || "次にやることが未記入") + '</span></span>' +
        '</button></li>';
    }).join("") +
    '</ul></section>';
}

function questionsTo(name){
  var out = [];
  state.cases.forEach(function(c){
    if(c.status === "done") return;
    pendingOf(c).forEach(function(q){ if((q.to || "") === name) out.push({ c: c, q: q }); });
  });
  return out;
}

function focusHtml(name){
  var list = holderCases(name);
  var qs = questionsTo(name);
  var warn = list.filter(needsAttention).length;
  var longest = list.reduce(function(m, c){ return Math.max(m, daysSince(c.movedAt)); }, 0);
  return '<div class="focus">' +
    '<span class="fn"><i></i>' + esc(name || "担当未定") + '</span>' +
    '<span class="fs">ボール ' + list.length + '件 ／ 要対応 ' + warn + '件 ／ 最長 ' + longest + '日停滞' +
      (qs.length ? ' ／ 未回答 ' + qs.length + '件' : '') + '</span>' +
    '<span class="sp"></span>' +
    (list.length || qs.length
      ? '<button class="btn" type="button" data-copy="' + esc(name) + '">貼り付ける文面をつくる</button>' : '') +
    '</div>';
}

function renderFilters(){
  var c = counts();
  var defs = [
    { k:"all",   t:"進行中", n:c.all },
    { k:"mine",  t:"自分のボール", n:c.mine },
    { k:"q",     t:"未回答", n:c.q },
    { k:"stuck", t:"要対応", n:c.stuck },
    { k:"done",  t:"完了", n:c.done }
  ];
  document.getElementById("filters").innerHTML = defs.map(function(d){
    return '<button class="fbtn" type="button" data-filter="' + d.k + '" aria-pressed="' +
      (state.filter === d.k ? "true" : "false") + '">' + d.t +
      '<span class="n">' + d.n + '</span></button>';
  }).join("");
}

function caseHtml(c){
  var open = state.openId === c.id;
  var lvl = stallLevel(c);
  var d = daysSince(c.movedAt);
  var ph = typeof c.phase === "number" ? c.phase : 0;
  var u = daysUntil(c.due);

  var ticks = "";
  for(var i = 0; i < PHASES.length; i++) ticks += '<i class="' + (i <= ph ? "on" : "") + '"></i>';

  var dueCls = "", dueTxt = "";
  if(c.due){
    dueCls = u < 0 ? "due-over" : (u <= 2 ? "due-soon" : "");
    dueTxt = c.due.slice(5).replace("-","/") +
      (u < 0 ? "（" + (-u) + "日超過）" : u === 0 ? "（今日）" : "（あと" + u + "日）");
  }

  var isMine = c.status !== "done" && state.me && c.holder === state.me;

  var h = '<article class="case' + (c.status === "done" ? " is-done" : "") +
            (isMine ? " is-mine" : "") + (open ? " is-open" : "") + '">' +
    '<button class="case-head" type="button" data-open="' + esc(c.id) + '" aria-expanded="' + open + '">' +
      '<span>' +
        '<span class="kind">' + esc(c.kind || "その他") + '</span>' +
        '<span class="title">' + esc(c.title) + '</span>' +
        '<span class="phase"><span class="no">' + (ph+1) + ' / ' + PHASES.length + '</span>' +
          '<span class="nm">' + esc(PHASES[ph] || "—") + '</span>' +
          '<span class="ticks">' + ticks + '</span></span>' +
        (c.status === "done"
          ? '<span class="ball none"><span class="b"><i></i>完了</span></span>'
          : '<span class="ball' + (c.holder ? "" : " none") + (isMine ? " you" : "") + '">' +
              '<span class="b"><i></i>' + esc(isMine ? "あなた" : (c.holder || "担当未定")) + '</span>' +
              '<span class="sfx">' + (c.holder ? "が持っている" : "＝誰も持っていない") + '</span></span>') +
        '<span class="ask' + (c.ask ? "" : " blank") + '">' +
          esc(c.ask || "次にやることが書かれていません") + '</span>' +
        '<span class="meta">' +
          (c.due ? '<span class="' + dueCls + '">期限 ' + esc(dueTxt) + '</span>' : '') +
          '<span>最終更新 <b>' + esc(fmtDate(c.updatedAt)) + '</b></span>' +
        '</span>' +
      '</span>' +
      '<span class="stall ' + lvl + '">' +
        (d ? '<span class="v">' + d + '</span><span class="u">日停滞</span>'
           : '<span class="u only">本日</span>') + '</span>' +
    '</button>';

  h += qbandHtml(c);
  if(open) h += panelHtml(c);
  return h + '</article>';
}

function qbandHtml(c){
  var qs = pendingOf(c);
  if(!qs.length || c.status === "done") return "";
  return '<div class="qband">' + qs.map(function(q){
    var d = daysSince(q.at);
    return '<div class="qrow">' +
      '<span class="qwho">' + esc(q.by) + ' → ' + esc(q.to || "全員") + '　未回答' + (d ? "・" + d + "日" : "") + '</span>' +
      '<span class="qtext">' + esc(q.text) + '</span>' +
      '<button class="btn" type="button" data-answer="' + esc(c.id) + '" data-q="' + esc(q.id) + '">返答する</button>' +
      '</div>';
  }).join("") + '</div>';
}

function panelHtml(c){
  var done = c.status === "done";
  var h = '<div class="panel"><div class="acts">';
  if(!done){
    h += '<button class="btn primary" type="button" data-act="pass" data-id="' + esc(c.id) + '">ボールを渡す</button>' +
         '<button class="btn" type="button" data-act="ask" data-id="' + esc(c.id) + '">質問する</button>' +
         '<button class="btn" type="button" data-act="note" data-id="' + esc(c.id) + '">進捗を書く</button>' +
         '<button class="btn" type="button" data-act="nudge" data-id="' + esc(c.id) + '">催促する</button>' +
         '<button class="btn" type="button" data-act="phase" data-id="' + esc(c.id) + '">工程を進める</button>' +
         '<button class="btn" type="button" data-act="edit" data-id="' + esc(c.id) + '">編集</button>' +
         '<button class="btn quiet" type="button" data-act="finish" data-id="' + esc(c.id) + '">完了にする</button>';
  } else {
    h += '<button class="btn" type="button" data-act="reopen" data-id="' + esc(c.id) + '">再開する</button>' +
         '<button class="btn quiet" type="button" data-act="edit" data-id="' + esc(c.id) + '">編集</button>';
  }
  h += '</div><div class="loghead">やりとりの記録</div>';

  if(!state.logs.length){
    h += '<p style="margin:0;color:var(--ink-3);font-size:13px">まだ記録がありません。</p></div>';
    return h;
  }
  h += '<ul class="log">' + state.logs.map(function(l){
    return '<li class="k-' + esc(l.kind) + '">' +
      '<span class="lh"><span class="lw">' + esc(l.by) + '</span>' +
      '<span class="lk">' + esc(LOG_KIND[l.kind] || l.kind) + '</span>' +
      (l.to ? '<span style="font-size:12px;color:var(--ink-3)">→ ' + esc(l.to) + '</span>' : '') +
      '<span class="lt">' + esc(fmtStamp(l.at)) + '</span></span>' +
      (l.text ? '<span class="lb">' + esc(l.text) + '</span>' : '') +
      '</li>';
  }).join("") + '</ul></div>';
  return h;
}

/* ===== modal ===== */
function closeModal(){ document.getElementById("modal").innerHTML = ""; }

function openModal(html, onMount){
  var m = document.getElementById("modal");
  m.innerHTML = '<div class="scrim" data-scrim="1"><div class="sheet" role="dialog" aria-modal="true">' + html + '</div></div>';
  m.querySelector('[data-scrim]').addEventListener("mousedown", function(e){
    if(e.target === e.currentTarget) closeModal();
  });
  if(onMount) onMount(m.querySelector(".sheet"));
  var f = m.querySelector("input,select,textarea,button");
  if(f) f.focus();
}

function memberChips(selected, idPrefix){
  return '<div class="chips" id="' + idPrefix + '">' +
    roster().map(function(m){
      return '<button class="chip" type="button" data-name="' + esc(m.name) + '" aria-pressed="' +
        (m.name === selected ? "true" : "false") + '">' + esc(m.name) +
        (m.role ? '<span class="r">' + esc(m.role) + '</span>' : '') + '</button>';
    }).join("") +
    '<button class="chip add" type="button" data-name="__new">＋ 名前を追加</button></div>';
}

function bindChips(root, id, onPick){
  var box = root.querySelector("#" + id);
  if(!box) return;
  box.addEventListener("click", function(e){
    var b = e.target.closest(".chip"); if(!b) return;
    if(b.dataset.name === "__new"){
      var v = window.prompt("名前を入力してください");
      v = v && v.trim();
      if(!v) return;
      if(state.members.indexOf(v) === -1) state.members.push(v);
      rememberMember(v);
      var nb = document.createElement("button");
      nb.className = "chip"; nb.type = "button"; nb.dataset.name = v; nb.textContent = v;
      box.insertBefore(nb, b);
      b = nb;
    }
    Array.prototype.forEach.call(box.querySelectorAll(".chip"), function(x){
      x.setAttribute("aria-pressed", x === b ? "true" : "false");
    });
    onPick(b.dataset.name);
  });
}

/* ===== events ===== */
function byId(id){ return state.cases.filter(function(c){ return c.id === id; })[0]; }

document.addEventListener("click", function(e){
  var t;
  if(state.err){ state.err = ""; setTimeout(render, 0); }

  if(e.target.closest("#whoBtn")){ whoModal(); return; }
  if(e.target.closest("#rosterBtn")){ rosterModal(); return; }
  if(e.target.closest("#newBtn")){ requireMe(newCaseModal); return; }

  t = e.target.closest("[data-answer]");
  if(t){
    var ac = byId(t.getAttribute("data-answer"));
    var aq = ac && pendingOf(ac).filter(function(x){ return x.id === t.getAttribute("data-q"); })[0];
    if(ac && aq) requireMe(function(){ answerModal(ac, aq); });
    return;
  }

  t = e.target.closest("[data-filter]");
  if(t){ state.filter = t.dataset.filter; state.holderFilter = null; render(); return; }

  t = e.target.closest("[data-holder]");
  if(t){
    var h = t.dataset.holder;
    state.holderFilter = state.holderFilter === h ? null : h;
    if(state.filter === "done" || state.filter === "mine") state.filter = "all";
    render(); return;
  }

  t = e.target.closest("[data-copy]");
  if(t){ shareModal(t.dataset.copy); return; }

  t = e.target.closest("[data-jump]");
  if(t){
    var jid = t.getAttribute("data-jump");
    var seenId = t.getAttribute("data-seen");
    if(seenId){
      var sc = byId(seenId);
      if(sc && sc.lastReply) markReplySeen(sc.id, sc.lastReply.at);
    }
    state.filter = "all"; state.holderFilter = null;
    state.openId = jid; state.jumpTo = jid;
    watchLog(jid); render(); return;
  }

  t = e.target.closest("[data-open]");
  if(t){
    var id = t.dataset.open;
    state.openId = state.openId === id ? null : id;
    watchLog(state.openId);
    render(); return;
  }

  t = e.target.closest("[data-act]");
  if(t){
    var c = byId(t.dataset.id);
    if(!c) return;
    var act = t.dataset.act;
    requireMe(function(){
      if(act === "pass")   return passModal(c);
      if(act === "ask")    return askModal(c);
      if(act === "phase")  return phaseModal(c);
      if(act === "edit")   return editModal(c);
      if(act === "note")   return textModal("進捗を書く", c.title, "例：役所に提出済み。返答待ち。", "記録する",
                                            function(v){ return addNote(c, v); });
      if(act === "nudge")  return textModal("催促する", c.title + " ／ " + (c.holder || "担当未定") + " さんへ",
                                            "例：来週の着工に間に合いますか？", "催促を記録",
                                            function(v){ return nudge(c, v); });
      if(act === "finish"){
        if(window.confirm("この案件を完了にしますか？")) finish(c).catch(fail);
        return;
      }
      if(act === "reopen") return reopen(c).catch(fail);
    });
    return;
  }
});

document.addEventListener("keydown", function(e){
  if(e.key === "Escape") closeModal();
});

try{ state.me = localStorage.getItem("ballboard.me") || null; }catch(e){}
boot();
})();
</script>
